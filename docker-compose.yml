services:

  api:
    build: .
    container_name: transaction_api

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

    volumes:
      - .:/app

    restart: always


  worker:
    build: .
    container_name: transaction_worker

    command: python -m celery -A app.workers.tasks worker --pool=solo --loglevel=info

    env_file:
      - .env

    depends_on:
      - db
      - redis

    volumes:
      - .:/app

    restart: always


  db:
    image: postgres:16
    container_name: transaction_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: transaction_redis

    restart: always

    ports:
      - "6379:6379"


volumes:
  postgres_data: